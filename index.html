<!doctype html>
<html lang="ko" data-theme="dark" style="--topbar-h: 54px;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TASK MANAGER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&amp;display=swap">
<style>
/* ===== 테마 ===== */
:root[data-theme="dark"] {
  --paper: #16181b; --surface: #1e2126; --surface-2: #262a2f;
  --ink: #e9eaec; --ink-2: #a6abb2; --ink-3: #71767d;
  --line: #33383e; --line-soft: #2a2e34;
  --accent: #fcd039; --accent-dim: #c9a32a; --accent-ink: #1a1c1f;
  --accent-soft: rgba(252,208,57,.13); --accent-line: rgba(252,208,57,.42);
  --mark-bg: rgba(252,208,57,.28);
  --caution: #d9705e; --caution-soft: rgba(217,112,94,.12);
  --ok: #7f868e; --shadow: 0 10px 30px rgba(0,0,0,.45);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --paper: #f3f3f6; --surface: #ffffff; --surface-2: #f0eff5;
  --ink: #1b1b21; --ink-2: #55555f; --ink-3: #8b8b96;
  --line: #dddde4; --line-soft: #ebeaf0;
  --accent: #6b3fd4; --accent-dim: #8b6ae2; --accent-ink: #ffffff;
  --accent-soft: rgba(107,63,212,.09); --accent-line: rgba(107,63,212,.38);
  --mark-bg: rgba(107,63,212,.16);
  --caution: #c0392b; --caution-soft: rgba(192,57,43,.08);
  --ok: #9a9aa4; --shadow: 0 10px 30px rgba(30,20,60,.14);
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: "IBM Plex Sans KR", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-size: 15px; line-height: 1.72; word-break: keep-all; -webkit-font-smoothing: antialiased;
}
button, input { font-family: inherit; font-size: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shell { min-height: 100vh; }

/* ===== 서랍 목록 ===== */
.rail {
  position: fixed; top: var(--topbar-h, 53px); bottom: 0; left: 0; width: 278px; z-index: 60;
  display: flex; flex-direction: column; background: var(--surface);
  border-right: 1px solid var(--line); box-shadow: var(--shadow);
  transform: translateX(-102%); transition: transform .18s ease;
}
body[data-rail="open"] .rail { transform: none; }
.rail-head { padding: 20px 18px 14px; border-bottom: 1px solid var(--line-soft); }
.rail-title { font-size: 17px; font-weight: 600; line-height: 1.4; letter-spacing: -.01em; text-wrap: balance; }
.rail-sub { margin-top: 5px; font-size: 12px; color: var(--ink-3); }
.rail-list { flex: 1; overflow-y: auto; padding: 12px 10px 24px; }
.toc-item {
  display: block; width: 100%; text-align: left; cursor: pointer; padding: 7px 10px;
  border: 0; border-radius: 6px; background: transparent;
  font-size: 13.5px; line-height: 1.5; color: var(--ink-2);
}
.toc-item:hover { background: var(--surface-2); color: var(--ink); }
.toc-item[aria-current="true"] { color: var(--accent); font-weight: 600; background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.toc-empty { color: var(--ink-3); font-size: 13px; padding: 10px; margin: 0; line-height: 1.6; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 13px; line-height: 1.3; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn-primary:hover { background: var(--accent); filter: brightness(1.06); }
.btn-danger { color: var(--caution); border-color: var(--caution); }

/* ===== 상단 ===== */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 70; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 24px; background: var(--paper); border-bottom: 1px solid var(--line);
}
.crumb { font-size: 12px; color: var(--ink-3); }
.spacer { flex: 1; }
.status { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.status[data-state="dirty"]::before { background: var(--accent); }

/* ===== 메인 화면 ===== */
.home { padding: 52px 24px 90px; }
.home-inner { max-width: 900px; margin: 0 auto; }
.home h1 { margin: 0; text-align: center; font-size: 15px; font-weight: 600; letter-spacing: .3em; color: var(--ink-2); text-indent: .3em; }
.project-line { text-align: center; margin: 10px 0 0; }
.project-btn {
  border: 0; background: none; cursor: pointer; padding: 3px 8px; border-radius: 6px;
  font-size: 22px; font-weight: 600; letter-spacing: -.015em; color: var(--ink);
}
.project-btn:hover { background: var(--surface-2); }
.project-btn.empty { font-size: 14px; font-weight: 400; color: var(--ink-3); }
.home-search {
  display: block; width: 100%; max-width: 520px; margin: 26px auto 0; padding: 12px 16px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 14px;
}
.home-search::placeholder { color: var(--ink-3); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; margin: 18px 0 30px; }
.filter { padding: 5px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 12.5px; cursor: pointer; }
.filter:hover { color: var(--ink); }
.filter[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.filter-add { border-style: dashed; color: var(--ink-3); }
.filter-add:hover { color: var(--accent); border-color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { text-align: left; cursor: pointer; padding: 16px 18px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: inherit; display: flex; flex-direction: column; gap: 7px; }
.card:hover { border-color: var(--accent-line); }
.card.dragging { opacity: .4; }
.card.drag-over { box-shadow: inset 0 3px 0 var(--accent); }
.card .k { font-size: 11px; color: var(--ink-3); }
.card .t { font-size: 15px; font-weight: 600; line-height: 1.4; }
.card .x { font-size: 12.5px; color: var(--ink-2); line-height: 1.6; }
.card .d { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-top: auto; }
.empty-stage { display: flex; align-items: center; justify-content: center; min-height: 48vh; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-top: 26px; }
.plus { width: 74px; height: 74px; border-radius: 12px; border: 0; cursor: pointer; background: transparent; color: var(--ink-3); position: relative; }
.plus:hover { color: var(--accent); background: var(--accent-soft); }
.plus::before, .plus::after { content: ""; position: absolute; background: currentColor; border-radius: 2px; }
.plus::before { left: 50%; top: 22px; width: 8px; height: 30px; transform: translateX(-50%); }
.plus::after { top: 50%; left: 22px; height: 8px; width: 30px; transform: translateY(-50%); }
.empty-hint { text-align: center; color: var(--ink-3); font-size: 13px; margin: 14px 0 0; }

/* ===== 문서 ===== */
.sheet-wrap { padding: 26px 24px 90px; }
.sheet { max-width: 880px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 34px 40px 48px; }
h1.title { margin: 0; font-size: 28px; font-weight: 600; line-height: 1.32; letter-spacing: -.015em; text-wrap: balance; }
h1.title:empty::before { content: "제목 없음"; color: var(--ink-3); }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; padding-bottom: 18px; border-bottom: 1px solid var(--line-soft); }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chip label { color: var(--ink-3); }
.chip-stamp { border-style: dashed; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--accent); color: var(--ink); }
button.chip[disabled] { cursor: default; }
button.chip[disabled]:hover { border-color: var(--line); color: var(--ink-2); }
.chip .val { color: var(--ink); font-weight: 500; }
.chip .caret { color: var(--ink-3); font-size: 9px; }

.toolbar { position: sticky; top: 52px; z-index: 15; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 16px 0 4px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.toolbar button { border: 0; background: transparent; border-radius: 5px; cursor: pointer; padding: 4px 9px; font-size: 12.5px; color: var(--ink-2); }
.toolbar button:hover { background: var(--surface); color: var(--ink); }
.toolbar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; }
.toolbar .s1 { font-size: 14.5px; font-weight: 600; }
.toolbar .s2 { font-size: 13px; font-weight: 600; }
.toolbar .s3 { font-size: 12.5px; }
.toolbar .s4 { font-size: 11.5px; color: var(--ink-3); }
.toolbar .em { color: var(--accent); font-weight: 700; }
.toolbar .hl { background: var(--mark-bg); }

/* 글자 계단: 제목 24 / 소제목 19 / 본문 15 / 부가설명 13 */
.body { margin-top: 20px; font-size: 15px; }
.body:focus { outline: none; }
.body[contenteditable="true"] { min-height: 320px; }
.body[contenteditable="true"]:empty::before { content: "여기에 문서를 작성한다. 다른 문서는 [[문서 제목]] 으로 연결한다."; color: var(--ink-3); }
.body > *:first-child { margin-top: 0; }
.body h2 { margin: 34px 0 10px; padding-bottom: 8px; font-size: 24px; font-weight: 600; line-height: 1.35; letter-spacing: -.015em; border-bottom: 1px solid var(--line-soft); text-wrap: balance; }
.body h3 { margin: 24px 0 6px; font-size: 19px; font-weight: 600; line-height: 1.45; }
.body p { margin: 10px 0; font-size: 15px; }
.body p.aside { font-size: 13px; color: var(--ink-3); line-height: 1.68; margin: 6px 0; }
.body ul, .body ol { margin: 10px 0; padding-left: 22px; }
.body li { margin: 4px 0; }
.body a { color: var(--accent); }
.body mark { background: var(--mark-bg); color: inherit; padding: 0 3px; border-radius: 3px; }
.body strong.em { color: var(--accent); font-weight: 700; }
.body .align-center { text-align: center; }
.body .align-right { text-align: right; }
.body img { max-width: 100%; height: auto; border-radius: 6px; vertical-align: middle; }
.body[contenteditable="false"] img { cursor: zoom-in; }
.body[contenteditable="true"] img { outline: 1px solid var(--line); outline-offset: 2px; }
.body[contenteditable="true"] img:hover { outline-color: var(--accent-line); }
.body.col-edge, .body.col-edge * { cursor: col-resize !important; }
.body.img-corner, .body.img-corner * { cursor: nwse-resize !important; }
.lightbox {
  position: fixed; inset: 0; z-index: 130; background: rgba(0,0,0,.92);
  display: flex; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out;
}
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
.lightbox .hint { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.55); font-size: 12px; }
.table-scroll { overflow-x: auto; margin: 12px 0; }
.body table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 420px; }
.body table.fixed { table-layout: fixed; }
.body th, .body td { border: 1px solid var(--line); padding: 8px 11px; vertical-align: top; text-align: left; font-variant-numeric: tabular-nums; word-break: break-word; }
.body th { background: var(--surface-2); font-weight: 600; color: var(--ink-2); }
.body[contenteditable="true"] th, .body[contenteditable="true"] td { position: relative; }
.body blockquote { margin: 14px 0; padding: 11px 15px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; }
.body .warn { margin: 14px 0; padding: 11px 15px; border-left: 3px solid var(--caution); background: var(--caution-soft); border-radius: 0 6px 6px 0; }
.wikilink { color: var(--accent); border-bottom: 1px solid var(--accent-line); cursor: pointer; }
.wikilink:hover { border-bottom-color: var(--accent); }
.wikilink[data-missing="1"] { color: var(--accent-dim); border-bottom-style: dashed; }

.links-box { max-width: 880px; margin: 16px auto 0; }
.links-box h4 { margin: 0 0 8px; font-size: 11px; color: var(--ink-3); font-weight: 500; }
.links-box .row { display: flex; flex-wrap: wrap; gap: 6px; }
.link-pill { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.link-pill:hover { border-color: var(--accent); color: var(--accent); }

/* ===== 메뉴 · 대화상자 · 알림 ===== */
.menu { position: fixed; z-index: 100; min-width: 182px; max-height: 76vh; overflow: auto; padding: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.menu button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer; padding: 6px 10px; border-radius: 5px; font-size: 13px; color: var(--ink-2); }
.menu button:hover { background: var(--surface-2); color: var(--ink); }
.menu button[disabled] { opacity: .38; cursor: default; }
.menu button[disabled]:hover { background: transparent; color: var(--ink-2); }
.menu .danger { color: var(--caution); }
.menu hr { border: 0; border-top: 1px solid var(--line-soft); margin: 5px 2px; }
.menu .tick { color: var(--accent); }

.overlay { position: fixed; inset: 0; z-index: 110; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 20px; }
.dialog { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; box-shadow: var(--shadow); }
.dialog h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; line-height: 1.5; }
.dialog input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--ink); font-size: 14px; }
.dialog .row { display: flex; justify-content: flex-end; gap: 7px; margin-top: 16px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--line); color: var(--ink); padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 120; box-shadow: var(--shadow); }

@media (max-width: 860px) {
  .rail { width: 84vw; max-width: 300px; }
  .home { padding: 32px 16px 70px; }
  .sheet-wrap { padding: 16px 16px 70px; }
  .sheet { padding: 24px 18px 36px; border-radius: 8px; }
  .topbar { padding: 10px 16px; }
  h1.title { font-size: 23px; }
  .body h2 { font-size: 21px; }
  .body h3 { font-size: 17.5px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="shell">
  <aside class="rail" id="rail">
    <div class="rail-head">
      <div class="rail-title" id="railTitle">MAP 01 폐마트 - 레벨 기획서</div>
      <div class="rail-sub" id="railSub">Repair / 레벨 기획서</div>
    </div>
    <div class="rail-list" id="railList"></div>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <button class="btn btn-primary" id="newBtn" hidden="">+ 새 문서</button>
      <button class="btn" id="homeBtn">← 메인</button>
      <button class="btn" id="railToggle">☰ 목차</button>
      <span class="crumb" id="crumb">레벨 기획서</span>
      <span class="spacer"></span>
      <span class="status" id="status" data-state="idle"></span>
      <button class="btn" id="themeBtn">라이트</button>
      <button class="btn" id="shareBtn">공유</button>
      <button class="btn" id="modeBtn">편집</button>
    </div>
    <div id="stage"></div>
  </main>
</div>

<script id="seed" type="application/json">{"v":3,"savedAt":"2026-09-11 18:35","project":"Repair","types":["레벨 기획서","메트릭스 / 스펙","작업 로그","회고","기타"],"docs":[{"id":"guide","title":"사용법과 문서 규칙","docType":"기타","order":0,"updatedAt":"2026-09-11 09:09","html":"<p>레벨 디자인 문서와 작업 로그를 모아 두는 곳이다. 편집을 마치고 저장을 누르면 문서가 확정되고, 공유를 누르면 이 파일 자체가 갱신된다. 갱신된 파일을 깃허브에 커밋하면 팀원이 보는 내용도 함께 바뀐다.</p><h2>제목 규칙</h2><p>문서 제목은 <strong class=\"em\">구역명 - 문서 유형</strong> 형식으로 쓴다. 목록에서 어느 맵의 어떤 문서인지 제목만 보고 판단할 수 있어야 한다. 프로젝트 이름은 메인 화면 위쪽에서 한 번만 설정한다.</p><h2>분류</h2><div class=\"table-scroll\"><table class=\"fixed\"><thead><tr><th>분류</th><th>담는 내용</th></tr></thead><tbody><tr><td>레벨 기획서</td><td>맵 하나의 공간 구조. 구역 배치, 동선, 집기, 기믹</td></tr><tr><td>메트릭스 / 스펙</td><td>맵마다 반복되는 공통 기준값</td></tr><tr><td>작업 로그</td><td>날짜별 작업 기록</td></tr><tr><td>회고</td><td>빌드나 테스트 이후의 판단 기록</td></tr></tbody></table></div><h3>분류와 순서 바꾸기</h3><p>메인 화면의 분류 칩에서 <mark>+ 분류</mark>로 추가하고, 칩을 우클릭해 이름 변경과 삭제를 한다. 문서 카드를 우클릭하면 이름 변경, 분류 바꾸기, 위아래 이동, 복제, 삭제를 쓸 수 있다. 카드를 끌어다 놓으면 순서가 바뀌고, 다른 분류의 카드 위에 놓으면 분류까지 함께 바뀐다.</p><h3>목차</h3><p>문서를 열고 왼쪽 위 목차 버튼을 누르면 그 문서의 제목이 순서대로 모인다. 항목을 누르면 해당 위치로 이동하고, 지금 읽고 있는 위치가 강조색으로 표시된다.</p><h3>표 고치기</h3><p>편집 중에 표 안을 우클릭하면 행과 열을 넣고 지울 수 있다. 셀 오른쪽 경계를 끌면 열 너비가 바뀐다.</p><h3>이미지</h3><p>툴바의 이미지 버튼으로 넣거나, 그림 파일을 본문에 끌어다 놓거나, 복사한 이미지를 붙여 넣는다. 이미지 오른쪽 아래 모서리를 끌면 크기가 바뀌고, 우클릭하면 너비와 정렬을 고르거나 전체화면으로 볼 수 있다. 읽기 상태에서는 이미지를 누르면 전체화면으로 열린다.</p><p class=\"aside\">이미지는 파일 안에 함께 저장되므로 넣을수록 파일이 커진다. 긴 변 1600픽셀로 자동으로 줄여 넣는다.</p><h2>공통 기준은 나누지 않는다</h2><p>카메라와 투영, 좌표계, 벽 투명화, 집기 높이 밴드, 통로 폭, 개활 면적, 기습 앵커처럼 맵마다 반복되는 값은 개별 맵 문서에 적지 않는다. [[공통 - 레벨 메트릭스 / 스펙]] 한 곳에 두고 맵 문서는 그 값을 전제로 쓴다. 같은 값을 두 곳에 적으면 반드시 한쪽이 낡는다.</p><h2>문서 연결</h2><p>본문에 대괄호 두 개로 문서 제목을 감싸면 그 문서로 가는 링크가 된다. 문서 아래에 참조하는 문서와 참조받는 문서가 자동으로 모인다.</p><p class=\"aside\">아직 없는 문서를 참조하면 링크가 흐리게 표시되고, 누르면 그 제목으로 새 문서가 만들어진다.</p><blockquote>되돌리기는 Ctrl+Z, 다시 실행은 Ctrl+Shift+Z, 파일 반영은 Ctrl+S다.</blockquote>"},{"id":"common","title":"공통 - 레벨 메트릭스 / 스펙","docType":"메트릭스 / 스펙","order":0,"updatedAt":"2026-09-11 09:09","html":"<p>모든 맵이 전제하는 공통 기준값을 모은 문서다. 개별 맵 문서는 이 값을 다시 적지 않고 참조만 한다.</p><p class=\"aside\">값을 바꿀 때는 이 문서만 고치고, 영향을 받는 맵 문서의 검수 항목을 다시 확인한다.</p><h2>카메라와 투영</h2><div class=\"table-scroll\"><table class=\"fixed\"><thead><tr><th>항목</th><th>값</th><th>근거</th></tr></thead><tbody><tr><td>Projection</td><td><br></td><td><br></td></tr><tr><td>Rotation</td><td><br></td><td><br></td></tr><tr><td>Ortho Size</td><td><br></td><td><br></td></tr><tr><td>가림 깊이</td><td><br></td><td><br></td></tr></tbody></table></div><h2>좌표계</h2><p>원점 위치, 축 방향, 표기 순서를 적는다.</p><h2>벽 투명화</h2><p>페이드 반경, 소프트 엣지, 알파 하한, 적용 레이어를 적는다.</p><h2>집기 높이 밴드</h2><p>밴드별 높이 범위와 대표 집기, 배치 제한을 적는다.</p><h2>통로 폭</h2><p>통로 종류별 최소 폭과 그 근거를 적는다.</p><h2>개활 면적</h2><p>연속 개활 상한과 분할 수단, 구역별 집기 점유율 범위를 적는다.</p><h2>기습 등장 앵커</h2><p>앵커 유형, 주 동선과의 거리, 앵커 간 간격, 후퇴 공간, 금지 구역을 적는다.</p><div class=\"warn\">이 문서의 값을 고치면 기존 맵 문서의 검수 결과가 무효가 된다. 변경 시 영향을 받는 맵을 함께 적어 둔다.</div>"},{"id":"map01","title":"MAP 01 폐마트 - 레벨 기획서","docType":"레벨 기획서","order":0,"updatedAt":"2026-09-11 18:35","html":"<blockquote><strong>한 줄 요약</strong> — 튜토리얼 직후 진입하는 첫 파밍 맵.</blockquote>\n<blockquote><strong>먼저 읽을 문서 — [[공통 - 레벨 메트릭스 / 스펙]]</strong><br></blockquote>\n\n<h2>1. 문서 범위와 설계 기준</h2>\n<h3>구역 설명</h3>\n<p>MAP 01은 플레이어가 익스트랙션 루프를 처음 완주하는 학습용 공간이다. 난도의 원천을 길 찾기나 전투가 아니라 \"더 챙길지 지금 돌아갈지\"의 판단 하나로 좁힌다. 동시에 이 맵은 폐마트라는 장소가 플레이어에게 즉시 읽혀야 한다. 구역 이름과 집기 구성만으로 여기가 라면 코너인지 냉장 코너인지 알 수 있어야 하며, 인간 세계 물건의 가치가 이 게임의 핵심 동기이기 때문이다.</p>\n<h3>설계 기준</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>항목</th><th>기준</th><th>근거</th></tr></thead><tbody>\n<tr><td>맵 볼륨</td><td>Floor 100 × 100 × 0.5 유닛</td><td>유니티 씬 기준값</td></tr>\n<tr><td>구역 정체성</td><td>매장 코너 단위로 유지</td><td>파밍 동기가 곧 장소 인식이다</td></tr>\n<tr><td>동선 형태</td><td>중앙 광장을 감싸는 양방향 순환 + 서브 루트 5개</td><td>루트 선택이 매 출격마다 달라지게 한다</td></tr>\n<tr><td>벽 구획</td><td>A · D · E · H 네 곳만 벽으로 구분</td><td>일반 마트처럼 매장 홀은 벽 없이 트여 있다</td></tr>\n<tr><td>동선 규칙성</td><td>회랑 폭을 구간별로 차등하고 코너를 꺾는다</td><td>정사각 회랑은 마트가 아니라 복도로 읽힌다</td></tr>\n<tr><td>단차</td><td>없음. 바닥은 완전 평면</td><td>구현 제약</td></tr>\n<tr><td>인공 광원</td><td>0개</td><td>전기가 끊긴 폐마트</td></tr>\n<tr><td>정석 플레이 타임</td><td>전체 개방 20분 / 1차 빌드 16분 30초</td><td>잠금 구역 2곳을 타 맵 아이템으로 후속 개방한다</td></tr>\n<tr><td>시연 플레이 타임</td><td>5분</td><td>전시회 관람객 1인당 체류 시간</td></tr>\n</tbody></table></div>\n<h3>설계 기준 기반 로직</h3>\n<ol>\n<li>붕괴, 침수, 오염은 구역의 이름이 아니라 구역 위에 얹는 상태 레이어로 처리한다. 빗물이 들어와 바닥이 젖어도 식품 코너는 식품 코너다.</li>\n<li>모든 위험은 진입 전에 시각적으로 예고한다. 예고 장치는 셔터, 잠긴 문, 오염 얼룩, 붕괴 잔해다.</li>\n<li>귀환 방향은 어디서든 3초 안에 파악할 수 있어야 한다. 중앙 광장의 빛기둥이 이를 보장한다.</li>\n<li>공간 안의 모든 물건은 영업 중 급하게 대피한 마트라는 하나의 전제에서 나온다.</li>\n</ol>\n<blockquote>이 맵은 첫 번째 맵이라는 역할이 우선한다. 밀도를 높이거나 사각을 만들어 긴장감을 올리고 싶은 요구는 다음 맵으로 넘기고 여기서는 반영하지 않는다.</blockquote>\n\n<h2>2. 맵 볼륨과 좌표계</h2>\n<h3>구역 설명</h3>\n<p>좌표 표기 규칙과 캐릭터 규격은 공통 문서를 따른다. 여기서는 MAP 01의 볼륨과 거리만 정한다. 외곽 폭 5 유닛은 이동 불가 후경 레이어이며, 주차장과 도로를 붕괴한 유리벽 너머로 보여 실내라는 사실과 바깥이 있다는 사실을 동시에 전달한다.</p>\n<h3>기준 수치</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>항목</th><th>수치</th><th>파생 값</th></tr></thead><tbody>\n<tr><td>Floor</td><td>100 × 100 × 0.5 유닛</td><td>후경 제외 플레이 영역 90 × 90</td></tr>\n<tr><td>후경 밴드</td><td>X 0~5 · 95~100 / Z 0~5 · 95~100</td><td>이동 불가</td></tr>\n<tr><td>순환 회랑 최단 순회</td><td>약 165 유닛</td><td>순수 이동 41초</td></tr>\n<tr><td>정석 루트 총 이동거리</td><td>약 320 유닛</td><td>순수 이동 80초</td></tr>\n<tr><td>시연 스킵 루트</td><td>약 130 유닛</td><td>순수 이동 33초</td></tr>\n<tr><td>매장 홀 천장 높이</td><td>6 유닛</td><td>창고 구역은 8</td></tr>\n</tbody></table></div>\n<h3>구역 배치 평면도</h3>\n<div class=\"warn\">평면도 SVG는 아직 옮기지 않았다. 노션 원본의 <strong>MAP01_구역배치_평면도</strong> 도면을 이 자리에 넣는다.</div>\n\n<h2>3. 구역별 배치 레이아웃</h2>\n<h3>구역 설명</h3>\n<p>맵은 매장 코너 7개와 중앙 광장 1개로 구성한다. 중앙 광장을 순환 회랑이 감싸고, 회랑 바깥에 코너들이 붙는 구조다. 각 구역은 회랑에 면한 진입구를 하나씩 가지며, 여기에 더해 서브 루트로만 닿는 진입구를 추가로 가진다. 구역의 크기는 균등하지 않다. 마트의 실제 매장이 균등하지 않고, 균등한 구역은 지도처럼 읽혀 탐색의 의미가 사라지기 때문이다.</p>\n<h3>구역 구성</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>코드</th><th>구역</th><th>X 범위</th><th>Z 범위</th><th>크기</th><th>얹는 상태 레이어</th></tr></thead><tbody>\n<tr><td>A</td><td>입구 · 계산대 라인</td><td>28~95</td><td>5~28</td><td>67 × 23</td><td>전면 유리와 자동문 붕괴. 외광 유입</td></tr>\n<tr><td>B</td><td>냉장 · 음료 코너</td><td>5~28</td><td>5~40</td><td>23 × 35</td><td>전기 끊김. 쇼케이스 문이 열린 채 성에가 녹은 자국</td></tr>\n<tr><td>C</td><td>식품 코너</td><td>5~28</td><td>40~72</td><td>23 × 32</td><td>광장 붕괴가 번져 천장 균열. 빗물로 바닥 젖음</td></tr>\n<tr><td>H</td><td>사무실</td><td>5~28</td><td>72~95</td><td>23 × 23</td><td>관리자가 잠그고 떠남. 잠긴 문</td></tr>\n<tr><td>D</td><td>냉동창고</td><td>28~72</td><td>72~95</td><td>44 × 23</td><td>밀폐 공간. 오염 농도 최고. <strong>보스존</strong></td></tr>\n<tr><td>E</td><td>물류창고</td><td>72~95</td><td>55~95</td><td>23 × 40</td><td>입고 중 중단. 하역 셔터와 파렛트 랙</td></tr>\n<tr><td>F</td><td>생활용품 코너</td><td>72~95</td><td>28~55</td><td>23 × 27</td><td>부패하지 않는 품목이라 보존 상태 최상</td></tr>\n<tr><td>G</td><td>중앙 특설 매대 광장</td><td>36~64</td><td>36~62</td><td>28 × 26</td><td>천장 함몰. 맵 유일의 직사광</td></tr>\n</tbody></table></div>\n<h3>벽 구획과 개방 경계</h3>\n<p>일반적인 마트와 같이 매장 홀은 벽으로 나뉘지 않는다. 벽으로 구분하는 곳은 네 곳뿐이며, 나머지 구역은 진열대 방향, 집기 종류, 바닥재, 명도로만 구분된다. 벽이 적을수록 쿼터뷰에서 시야가 트여 유리하고, 벽 투명화 처리 대상도 줄어 구현 부담이 낮아진다.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>구분</th><th>대상</th><th>비고</th></tr></thead><tbody>\n<tr><td>벽 구획</td><td>A 입구·계산대 / D 냉동창고 / E 물류창고 / H 사무실</td><td>실제 마트에서도 벽으로 닫히는 공간이다</td></tr>\n<tr><td>개방 구획</td><td>B 냉장·음료 / C 식품 / F 생활용품 / G 광장 / 순환 회랑</td><td>하나의 매장 홀. 경계에 벽이 없다</td></tr>\n<tr><td>완전 차단</td><td>A ↔ B (X 28, Z 5~28)</td><td>이 구간만 통행을 막는다. 입구에서 냉장 코너로 바로 갈 수 없다</td></tr>\n<tr><td>H 사무실 벽</td><td>남벽 Z 72 / 동벽 X 28</td><td>잠긴 방이므로 벽이 필요하다. 지정한 3곳에 더해 추가한 구획이다</td></tr>\n</tbody></table></div>\n<h3>통과 지점</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>통과 지점</th><th>좌표</th><th>폭</th><th>유형</th><th>조건</th></tr></thead><tbody>\n<tr><td>유리 자동문 W</td><td>(44~52, Z 28)</td><td>8</td><td>유리 자동문</td><td>수동 개방 후 상시. G6</td></tr>\n<tr><td>유리 자동문 E</td><td>(60~68, Z 28)</td><td>8</td><td>유리 자동문</td><td>수동 개방 후 상시. G6</td></tr>\n<tr><td>직원문 (A ↔ F)</td><td>(78~82, Z 28)</td><td>4</td><td>스윙 도어</td><td>상시. S3 도착점</td></tr>\n<tr><td>전실 이중 단열문</td><td>(44~56, Z 70)</td><td>12</td><td>문</td><td>상시. 보스존 정면 진입</td></tr>\n<tr><td>물류 문 (회랑 ↔ E)</td><td>(X 72, 58~64)</td><td>6</td><td>문</td><td>상시</td></tr>\n<tr><td>E ↔ F 문</td><td>(78~84, Z 55)</td><td>6</td><td>스윙 도어</td><td>상시</td></tr>\n<tr><td>북후문 (D ↔ E)</td><td>(X 72, 90~94)</td><td>4</td><td>셔터</td><td>셔터 개방. G1 · S4</td></tr>\n<tr><td>하역 셔터</td><td>(X 95, 70~90)</td><td>20</td><td>셔터</td><td>개방 시 R3 활성. G1</td></tr>\n<tr><td>H 사무실 앞문</td><td>(8~14, Z 72)</td><td>6</td><td>잠긴 문</td><td>관리자 카드키. <strong>1차 빌드 잠금</strong></td></tr>\n<tr><td>서후문 (H ↔ D)</td><td>(X 28, 80~84)</td><td>4</td><td>잠긴 문</td><td>H 내부. <strong>1차 빌드 잠금</strong>. S2</td></tr>\n<tr><td>E 보관실 방화셔터</td><td>(X 84, 88~92)</td><td>4</td><td>셔터</td><td>비상 개방키. <strong>1차 빌드 잠금</strong></td></tr>\n</tbody></table></div>\n<blockquote>개방 경계는 통과 지점을 따로 두지 않는다. B ↔ 회랑, B ↔ C, C ↔ 회랑, F ↔ 회랑, 회랑 ↔ G 는 벽이 없으므로 진열대 사이 어디로든 통행한다. 평면도의 회색 점선이 이 경계다.</blockquote>\n<h3>공간 납득성 — 구역별 오브젝트 근거</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>구역</th><th>주요 배치물</th><th>존재 근거</th></tr></thead><tbody>\n<tr><td>A</td><td>카트 보관대, 전복 카트, 계산대 8대, 전단지 스탠드, 무너진 자동문</td><td>사람들이 한꺼번에 빠져나간 방향으로 카트가 넘어져 있다</td></tr>\n<tr><td>B</td><td>냉장 쇼케이스, 음료 매대, 바닥 물 자국, 곰팡이 데칼</td><td>전기가 끊겨 성에가 녹아내렸다. 젖은 바닥이 반사면이 된다</td></tr>\n<tr><td>C</td><td>식품 곤돌라 6열, 엔드캡 판촉대, 무너진 천장재</td><td>광장에서 번진 균열로 천장재가 떨어졌다</td></tr>\n<tr><td>H</td><td>잠긴 사무실 문, 서류 캐비닛, 직원 락커, 블라인드 창</td><td>관리자가 잠그고 떠났다. 열쇠는 계산대에 남았다</td></tr>\n<tr><td>D</td><td>이중 단열문, 행거 레일, 성에 기둥, 적재 팔레트</td><td>창이 없는 밀폐 공간이라 오염이 고이기 가장 좋은 조건이다</td></tr>\n<tr><td>E</td><td>하역 셔터, 파렛트 랙, 지게차, 미개봉 박스</td><td>입고 중 중단되어 박스가 통로를 반쯤 막고 있다</td></tr>\n<tr><td>F</td><td>저층 곤돌라 진열대, 종이류, 세제 매대</td><td>부패하지 않아 손을 덜 탔고, 진열이 가장 잘 남아 있다</td></tr>\n<tr><td>G</td><td>붕괴 트러스, 콘크리트 잔해, 특설 매대, 판촉 배너, 잡초, 빗물 고임</td><td>마트에서 중앙이 뚫려 있다면 그곳은 판촉 행사 자리다. 잡초와 물웅덩이가 채광을 증명한다</td></tr>\n</tbody></table></div>\n<blockquote>잡초와 빗물은 장식이 아니다. 조명이 없는 맵에서 \"여기는 천장이 뚫려 있다\"를 대사나 UI 없이 설명하는 장치다.</blockquote>\n\n<h2>4. 순환 동선과 불규칙화</h2>\n<h3>구역 설명</h3>\n<p>메인 동선은 중앙 광장을 감싸는 순환 회랑이며 시계방향과 반시계방향 모두 성립한다. 다만 회랑을 폭이 일정한 정사각 도넛으로 두면 마트가 아니라 복도로 읽힌다. 회랑 폭을 구간별로 6에서 10까지 차등하고, 네 코너를 직각이 아니라 집기로 꺾어 실제 이동선이 팔각형에 가깝게 만든다. 여기에 막힌 통로 두 곳을 두어, 플레이어가 한 번은 되돌아 나오는 경험을 하게 한다.</p>\n<h3>회랑 구성</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>구간</th><th>범위</th><th>폭</th><th>불규칙 처리</th></tr></thead><tbody>\n<tr><td>남측 회랑</td><td>Z 28~36</td><td>8</td><td>입구 정면 X 44~60 구간만 Z 24~36으로 넓혀 폭 12. 진입 직후 시야를 열어 준다</td></tr>\n<tr><td>서측 회랑</td><td>X 28~36</td><td>8</td><td>C 구간 Z 44~60에서 진열대 붕괴로 X 30~36, 폭 6으로 좁아진다</td></tr>\n<tr><td>북측 회랑</td><td>Z 62~72</td><td>10</td><td>보스존 전실 앞이라 가장 넓다. 교전 전 정비 공간</td></tr>\n<tr><td>동측 회랑</td><td>X 64~72</td><td>8</td><td>F 구간 Z 34~46에서 특설 매대로 X 66~72, 폭 6으로 좁아진다</td></tr>\n<tr><td>남서 코너</td><td>28~36, 28~36</td><td>—</td><td>특설 매대 2개를 대각으로 놓아 통행선이 45도 꺾인다</td></tr>\n<tr><td>북서 코너</td><td>28~36, 62~72</td><td>5</td><td>붕괴 잔해로 좁아진다. 회랑 최협 지점</td></tr>\n<tr><td>북동 코너</td><td>64~72, 62~72</td><td>—</td><td>팔레트 적재로 ㄱ자 우회가 발생한다</td></tr>\n<tr><td>남동 코너</td><td>64~72, 28~36</td><td>6</td><td>전복 카트 더미</td></tr>\n</tbody></table></div>\n<h3>막힌 통로</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>ID</th><th>위치</th><th>막힌 원인</th><th>예고 방식</th></tr></thead><tbody>\n<tr><td>X1</td><td>A 동단 (88~92, 20~28)</td><td>천장재 붕괴</td><td>입구 쪽에서 잔해 실루엣이 보인다</td></tr>\n<tr><td>X2</td><td>C 서벽 (5~10, 56~62)</td><td>곤돌라 도미노 붕괴</td><td>통로 입구에서 넘어진 매대 열이 보인다</td></tr>\n</tbody></table></div>\n<div class=\"warn\">막힌 통로는 반드시 진입 전에 보여야 한다. 끝까지 걸어간 뒤에야 막힌 것을 알게 되면 탐색이 아니라 낭비가 된다. 검수 시 통로 입구에서 카메라 뷰로 잔해가 보이는지 확인한다.</div>\n<h3>양방향 루트</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>방향</th><th>순서</th><th>첫 구역</th><th>성격</th></tr></thead><tbody>\n<tr><td>시계방향</td><td>A → B → C → H → D → E → F → A</td><td>B 냉장·음료 코너</td><td>고급 식품을 먼저 확보하는 고보상 선점 루트</td></tr>\n<tr><td>반시계방향</td><td>A → F → E → D → H → C → B → A</td><td>F 생활용품 코너</td><td>보존 상태가 가장 좋은 구역에서 시작하는 저위험 학습 루트</td></tr>\n</tbody></table></div>\n<h3>구성 요소 기반 로직</h3>\n<ol>\n<li>카메라 기준 화면 아래가 남동이므로, 세계 좌표의 시계방향과 화면상 시계방향이 일치한다. 팀 내에서 방향을 말할 때 혼동이 없다.</li>\n<li>회랑 폭이 좁아지는 지점은 모두 심부 방향이다. 폭이 줄어드는 것 자체가 위험 예고로 작동한다.</li>\n<li>코너의 꺾임은 집기로 만든다. 벽을 꺾으면 구조가 복잡해져 그레이박싱 비용이 오른다.</li>\n<li>두 루트 모두 D 냉동창고를 지나가되 통과하지 않는다. 보스 교전은 언제나 플레이어의 선택이다.</li>\n</ol>\n<h3>상세 연결 로직</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>상황/트리거</th><th>연결되는 구성 요소</th><th>상호 영향과 처리</th><th>결과/예외</th></tr></thead><tbody>\n<tr><td>방향 선택</td><td>남측 회랑 확장부, 남서·남동 코너</td><td>진입 직후 폭 12 구간에서 좌우 코너가 동시에 보이며, 어느 쪽으로 돌지가 첫 판단이 된다.</td><td>어느 쪽을 골라도 완주가 성립하므로 소프트락이 없다.</td></tr>\n<tr><td>회랑 협착</td><td>서측·동측 회랑 협착부, 북서 코너</td><td>폭 6과 5 구간에서 이동이 느려지고 시야가 짧아져 긴장이 오른다.</td><td>협착부 길이는 공통 문서 기준대로 각 12 이하로 제한한다.</td></tr>\n<tr><td>되돌아 나오기</td><td>막힌 통로 X1, X2</td><td>탐색 중 한 번은 막힌 길을 만나 폐허라는 인상을 강화한다.</td><td>두 곳 모두 메인 루프 밖에 있어 완주 시간에 영향을 주지 않는다.</td></tr>\n</tbody></table></div>\n\n<h2>5. 서브 루트</h2>\n<h3>구역 설명</h3>\n<p>메인 회랑만 존재하면 출격할 때마다 같은 동선이 반복된다. 조건이 서로 다른 서브 루트 다섯 개를 얹어, 무엇을 가지고 있느냐에 따라 경로가 달라지게 한다. 서브 루트는 모두 폐마트에 있을 법한 통로이며, 새로운 구조물을 만들지 않고 기존 집기와 문을 활용한다.</p>\n<h3>서브 루트 구성</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>ID</th><th>이름</th><th>구간</th><th>진입 조건</th><th>효과</th></tr></thead><tbody>\n<tr><td>S1</td><td>진열대 붕괴 관통구</td><td>B ↔ C 경계 (12~18, 40)</td><td>없음</td><td>회랑을 거치지 않고 두 코너를 직결. 약 20 유닛 단축</td></tr>\n<tr><td>S2</td><td>직원 통로</td><td>C 북단 (8, 68) → H → D 서후문 (28, 82)</td><td>사무실 열쇠</td><td>사무실을 지나 보스존 서측으로 직접 진입</td></tr>\n<tr><td>S3</td><td>계산대 뒤 통로</td><td>A 내부 (60~92, 10~14) → F 남단 (78, 28)</td><td>없음</td><td>남동 코너를 건너뛰고 생활용품 코너로 직행</td></tr>\n<tr><td>S4</td><td>하역 통로</td><td>E 북단 (74, 90) → D 북후문 (68, 92)</td><td>셔터 개방</td><td>물류창고에서 보스존 북측으로 진입</td></tr>\n<tr><td>S5</td><td>광장 관통</td><td>G 내부 (50, 36) ↔ (50, 62)</td><td>없음</td><td>잔해 더미 사이를 지그재그로 통과. 링 우회 대비 약 26 유닛 단축</td></tr>\n</tbody></table></div>\n<h3>구성 요소 기반 로직</h3>\n<ol>\n<li>S1과 S3, S5는 조건이 없어 첫 출격에서도 쓸 수 있다. 발견 자체가 보상이 되도록 입구를 눈에 띄게 둔다.</li>\n<li>S2와 S4는 각각 열쇠와 셔터가 필요해 재출격의 이유를 만든다. 열쇠는 계산대에 고정 배치해 소프트락이 발생하지 않는다.</li>\n<li>보스존은 전실, 서후문, 북후문의 세 방향에서 진입할 수 있다. 어느 서브 루트를 확보했느냐에 따라 진입 방향이 달라진다.</li>\n<li>S5는 단축 거리가 크지만 잔해 더미로 굽어 있어 실제 이득이 크지 않다. 지름길이 메인 루프를 사장시키지 않게 하는 장치다.</li>\n</ol>\n<h3>상세 연결 로직</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>상황/트리거</th><th>연결되는 구성 요소</th><th>상호 영향과 처리</th><th>결과/예외</th></tr></thead><tbody>\n<tr><td>열쇠 획득</td><td>S2 직원 통로, H 사무실 잠긴 문</td><td>계산대에서 얻은 열쇠로 사무실 앞뒤 문이 열리며, 서측 루트가 보스존까지 직결된다.</td><td>열쇠가 없으면 H는 통과 불가 구역이고 서측 루트는 회랑으로만 이어진다.</td></tr>\n<tr><td>셔터 개방</td><td>S4 하역 통로, E 하역 셔터</td><td>셔터를 열면 하역 통로가 열리고 동시에 하역구 귀환 지점이 활성화된다.</td><td>셔터는 한 번 열면 닫을 수 없어 결정에 무게가 실린다.</td></tr>\n<tr><td>보스존 진입 방향</td><td>전실, 서후문, 북후문</td><td>세 진입구가 서로 다른 방향에서 열려 있어, 교전 시작 위치와 이탈 경로가 루트마다 달라진다.</td><td>세 진입구는 교전 중에도 모두 열린 상태를 유지한다.</td></tr>\n</tbody></table></div>\n\n<h2>6. 중앙 특설 매대 광장</h2>\n<h3>구역 설명</h3>\n<p>대형마트에서 중앙이 비어 있다면 그 자리는 판촉 행사 공간이다. 이 광장은 특설 매대와 판촉 배너가 놓여 있던 자리이며, 천장이 무너져 배너와 매대가 잔해에 깔려 있다. 맵 전체에서 직사광이 들어오는 유일한 공간이고, 링 어디에서든 빛기둥이 시야에 걸리므로 방향 기준이자 귀환 판단 지점으로 기능한다.</p>\n<h3>구성 요소</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>항목</th><th>좌표 / 수치</th><th>사양</th></tr></thead><tbody>\n<tr><td>구역</td><td>36~64, 36~62</td><td>28 × 26 유닛</td></tr>\n<tr><td>천장 함몰부</td><td>중심 (50, 49)</td><td>직경 20. 맵 유일의 천장 개구부</td></tr>\n<tr><td>바닥 광반</td><td>중심 (49, 50)</td><td>직경 22. 광축 기울기로 북서 1유닛 오프셋</td></tr>\n<tr><td>잔해 더미</td><td>중심 (50,49) 주위 반경 6</td><td>4개 분할. 각 직경 5~7 / 높이 1.2~2.2</td></tr>\n<tr><td>더미 사이 간격</td><td>2~3</td><td>시선은 통과, 콜라이더는 연결하여 통행 차단</td></tr>\n<tr><td>개구부 남</td><td>(50, 36)</td><td>폭 10. 입구 방향</td></tr>\n<tr><td>개구부 서</td><td>(36, 49)</td><td>폭 8</td></tr>\n<tr><td>개구부 동</td><td>(64, 49)</td><td>폭 8</td></tr>\n<tr><td>개구부 북</td><td>(50, 62)</td><td>폭 10. 보스존 전실로 직결</td></tr>\n<tr><td>귀환 지점 R2</td><td>(50, 44)</td><td>광반 남측 가장자리</td></tr>\n</tbody></table></div>\n<h3>구성 요소 기반 로직</h3>\n<ol>\n<li>잔해를 하나의 큰 덩어리가 아니라 네 개로 쪼갠 이유는 가림 때문이다. 직경 14 높이 5의 단일 덩어리는 축 방향 데드존이 10 유닛에 달해 광장 북서쪽이 통째로 보이지 않는다.</li>\n<li>더미 사이로 시선이 통해 반대편 회랑의 상황을 읽을 수 있고, 콜라이더는 연결되어 있어 관통은 불가능하다.</li>\n<li>바닥 광반은 화면에서 22 × 12.6의 타원으로 보인다. 광반 경계 데칼은 이 비율로 제작한다.</li>\n<li>천장 높이 6에 함몰부가 있으므로 빛기둥은 화면에서 약 4.9 높이로 보인다. 맵 어디에서든 인지 가능한 크기다.</li>\n</ol>\n\n<h2>7. 자연광 설계와 명도</h2>\n<h3>구역 설명</h3>\n<p>이 맵에는 인공 광원이 하나도 없다. 전기가 끊긴 폐마트라는 설정과 직결되며, 실시간 라이트는 중앙 광장의 직사광 하나만 사용한다. 나머지 밝기는 자연광 유입구와 앰비언트로 만든다. 조명으로 길을 안내할 수 없으므로, 유도는 전적으로 밝기 대비와 반사면, 집기의 형태가 맡는다.</p>\n<h3>자연광 유입구</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>ID</th><th>위치</th><th>형태</th><th>구역</th></tr></thead><tbody>\n<tr><td>L1</td><td>중앙 천장 함몰부 (50, 49)</td><td>직사 광주 + 더스트. 유일한 실시간 라이트</td><td>G</td></tr>\n<tr><td>L2</td><td>남측 전면 유리·자동문 (Z=5, X 40~85)</td><td>확산광</td><td>A</td></tr>\n<tr><td>L3</td><td>서측 고창 균열 (X=5, Z 10~34)</td><td>사선 빛띠 3줄</td><td>B</td></tr>\n<tr><td>L4</td><td>식품 코너 천장 균열 3곳</td><td>점 광반. 광장 붕괴가 번진 흔적</td><td>C</td></tr>\n<tr><td>L5</td><td>하역 셔터 틈 (X=95, Z 70~90)</td><td>세로 빛줄기 2줄</td><td>E</td></tr>\n<tr><td>L6</td><td>사무실 블라인드 창 (Z=95, X 8~24)</td><td>가로 줄무늬 광</td><td>H</td></tr>\n<tr><td>—</td><td>D 냉동창고</td><td>유입구 없음. 앰비언트 하한만</td><td>D</td></tr>\n</tbody></table></div>\n<h3>구역별 상대 명도</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>구역</th><th>명도</th><th>비고</th></tr></thead><tbody>\n<tr><td>G 중앙 광장</td><td>100%</td><td>기준값</td></tr>\n<tr><td>A 입구·계산대</td><td>100%</td><td>외광 유입</td></tr>\n<tr><td>B 냉장·음료</td><td>85%</td><td>젖은 바닥 반사 보정 포함</td></tr>\n<tr><td>F 생활용품</td><td>85%</td><td>학습 구역이므로 밝게 유지</td></tr>\n<tr><td>C 식품 코너</td><td>70%</td><td>점 광반 사이가 어둡다</td></tr>\n<tr><td>E 물류창고</td><td>70%</td><td>셔터 빛줄기 사이가 어둡다</td></tr>\n<tr><td>H 사무실</td><td>60%</td><td>블라인드 줄무늬</td></tr>\n<tr><td>D 냉동창고</td><td>55%</td><td>플레이 가능 하한</td></tr>\n</tbody></table></div>\n<h3>조명 없는 유도 장치</h3>\n<ol>\n<li>반사 바닥을 쓴다. 정답 동선 위에 젖은 바닥, 깨진 유리, 스테인리스 배수구를 깔아 약한 빛을 되쏘게 하고, 막힌 방향의 바닥은 먼지와 카펫으로 빛을 죽인다.</li>\n<li>밝기가 곧 위험도다. 어두워질수록 심부이며, 귀환 방향은 언제나 더 밝다. 이 규칙 하나로 길 찾기 부담이 사라진다.</li>\n<li>전복된 카트와 흩어진 전단지를 분기 입구 쪽으로 눕혀 유도선을 만든다.</li>\n<li>발광하는 배경 오브젝트는 두지 않는다. 빛을 내는 것은 기능을 가진 것뿐이다.</li>\n</ol>\n<blockquote>B 냉장·음료 코너가 심부에 가까운데도 명도 85%인 것은 젖은 바닥 때문이다. 광원이 없는 맵에서 \"왜 여기가 밝은가\"에 대한 답을 물이 대신한다. 아트 작업 시 바닥 러프니스를 낮게 잡아야 이 설계가 성립한다.</blockquote>\n\n<h2>8. 냉동창고 보스존 공간 구조</h2>\n<h3>구역 설명</h3>\n<p>전투 기믹은 이 문서의 범위가 아니므로 공간이 갖춰야 할 조건만 정의한다. D 냉동창고는 44 × 23 유닛이며, 창이 없는 밀폐 공간이라는 점이 오염이 가장 짙게 고인 이유가 된다. 핵심은 중앙 개활지를 충분히 확보하는 것이다. 첫 맵의 보스전에서 플레이어가 회피 공간을 눈으로 파악하지 못하면 난도가 아니라 정보 부족으로 사망한다.</p>\n<h3>공간 구성</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>항목</th><th>좌표 / 수치</th><th>사양</th></tr></thead><tbody>\n<tr><td>구역</td><td>28~72, 72~95</td><td>44 × 23 유닛</td></tr>\n<tr><td>천장 높이</td><td>8 유닛</td><td>창고 규격. 대형 개체 여유 확보</td></tr>\n<tr><td>중앙 교전 개활지</td><td>중심 (50, 84), 반경 9</td><td>밴드 B 이상 집기 금지. 밴드 A 팔레트 4개만 산재</td></tr>\n<tr><td>산재 팔레트</td><td>(43,79) (57,79) (43,89) (57,89)</td><td>공터감을 없애되 시야는 유지</td></tr>\n<tr><td>외곽 집기 링</td><td>서·동 벽에서 3 이격</td><td>밴드 B 팔레트 적재대 각 4기. Z 간격 6</td></tr>\n<tr><td>후방 통로</td><td>벽과 집기 링 사이 3</td><td>뒤로 돌 수 있는 경로 확보</td></tr>\n<tr><td>전실 (정면)</td><td>44~56, 68~72</td><td>이중 단열문. 폭 12. <strong>상시 개방</strong></td></tr>\n<tr><td>서후문</td><td>(28, 80~84)</td><td>폭 4. S2 직원 통로에서 진입. 1차 빌드 잠금</td></tr>\n<tr><td>북후문</td><td>(72, 90~94)</td><td>폭 4. S4 하역 통로에서 진입. 셔터</td></tr>\n<tr><td>광원</td><td>없음</td><td>앰비언트 55% + 성에 반사만</td></tr>\n</tbody></table></div>\n<h3>구성 요소 기반 로직</h3>\n<ol>\n<li>중앙 개활지 반경 9는 캐릭터가 어느 방향으로도 2.25초 직선 회피할 수 있는 거리다. 이보다 넓히면 공통 문서의 개활 면적 상한을 넘어 공터가 된다.</li>\n<li>외곽 집기 링에 밴드 B만 쓰는 이유는, 캐릭터 높이와 같은 밴드 C를 두면 쿼터뷰에서 캐릭터를 통째로 삼키기 때문이다.</li>\n<li>이중 단열문 전실은 냉동창고로서 당연한 구조인 동시에, 교전 시작 지점을 고정하고 이탈 경로를 시각적으로 남긴다.</li>\n<li>세 진입구는 교전 중에도 모두 열려 있어, 플레이어에게 이탈 가능성을 항상 보장한다.</li>\n</ol>\n<h3>상세 연결 로직</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>상황/트리거</th><th>연결되는 구성 요소</th><th>상호 영향과 처리</th><th>결과/예외</th></tr></thead><tbody>\n<tr><td>진입 방향 분기</td><td>전실, 서후문, 북후문, 서브 루트 S2·S4</td><td>확보한 서브 루트에 따라 진입 방향이 달라지고, 교전 시작 위치와 이탈 경로가 함께 바뀐다.</td><td>세 진입구 모두 중앙 개활지를 향하므로 어느 방향으로 들어와도 공간 파악은 동일하다.</td></tr>\n<tr><td>회피 공간 확보</td><td>외곽 집기 링, 후방 통로 3</td><td>집기 링을 벽에서 3 띄워 뒤로 돌 수 있는 순환 경로를 남긴다.</td><td>벽에 붙이면 코너에 갇히는 사망이 발생하므로 이격을 반드시 유지한다.</td></tr>\n<tr><td>어두운 공간의 가독성</td><td>명도 55%, 성에 반사, 벽 투명화</td><td>광원이 없으므로 성에가 낀 벽면과 바닥의 반사로 최소 가독성을 확보한다.</td><td>명도를 55% 아래로 내리면 개활지 경계가 읽히지 않아 회피 판단이 무너진다.</td></tr>\n</tbody></table></div>\n\n<h2>9. 시연 5분 동선 스크립트</h2>\n<h3>구역 설명</h3>\n<p>전시회 시연은 관람객 1인당 5분을 기준으로 한다. 시연자가 이 스크립트대로 진행하면 스폰부터 정산까지 5분 안에 도달한다. 조작, 장비, 전투, 파밍, 보스, 귀환 순으로 핵심 루프를 한 번씩 노출하도록 구성했다. 전실은 일반 플레이에서도 상시 개방이므로 시연과 정식 플레이의 경로가 같다. 시연에서 줄이는 것은 파밍 시간뿐이다.</p>\n<h3>타임코드 스크립트</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>타임코드</th><th>위치</th><th>동작</th><th>노출 요소</th></tr></thead><tbody>\n<tr><td>0:00~0:20</td><td>A 스폰 (52, 12)</td><td>이동·공격 조작 확인</td><td>쿼터뷰 카메라, 폐마트 입구</td></tr>\n<tr><td>0:20~0:40</td><td>시연자용 보관함 (52, 16)</td><td>종결 장비 수령</td><td>인벤토리 UI, 장비 착용</td></tr>\n<tr><td>0:40~1:00</td><td>A 계산대 라인 (60, 20)</td><td>계산대 구간 통과, 유리 자동문 개방</td><td>전투 1회, 계산대 집기, G6</td></tr>\n<tr><td>1:00~1:25</td><td>남측 회랑 확장부 (50, 30)</td><td>회랑 진입</td><td>좌우 코너와 빛기둥이 동시에 보임</td></tr>\n<tr><td>1:25~1:50</td><td>G 광장 (50, 44)</td><td>광장 진입, S5 관통</td><td>천장 함몰, 직사광, 잔해 더미</td></tr>\n<tr><td>1:50~2:05</td><td>전실 (50, 70)</td><td>이중 단열문 통과</td><td>냉기 방출 연출 G11</td></tr>\n<tr><td>2:05~4:10</td><td>D 중앙 (50, 84)</td><td>보스 교전</td><td>클라이맥스 전투</td></tr>\n<tr><td>4:10~4:35</td><td>D → G</td><td>광장으로 복귀</td><td>어두운 구역에서 밝은 구역으로의 대비</td></tr>\n<tr><td>4:35~5:00</td><td>귀환 지점 R2 (50, 44)</td><td>귀환 상호작용</td><td>귀환 연출, 정산 화면</td></tr>\n</tbody></table></div>\n<h3>운영 규칙</h3>\n<ol>\n<li>시간이 초과되면 0:40~1:00의 전투 구간을 생략하고 회랑으로 직행한다.</li>\n<li>시간이 남으면 광장에서 서측 개구부로 나가 C 식품 코너 입구를 잠깐 보여 준다.</li>\n<li>관람객이 직접 조작하는 경우 전투 구간을 2배로 늘리고 보스 교전 시간을 그만큼 줄인다.</li>\n<li>10분 시연에서는 A → F → E 반시계 루트로 진행한 뒤 셔터를 열고 북후문으로 보스존에 진입한다.</li>\n</ol>\n<div class=\"warn\">시연 빌드에서도 시연자용 보관함은 스폰 지점에 노출된다. 일반 빌드에서는 이 보관함을 비활성화해야 하며, 빌드 분기 처리를 누락하면 정식 플레이에서 최종 장비가 즉시 지급된다.</div>\n\n<h2>10. 시간 예산과 검수 기준</h2>\n<h3>구역 설명</h3>\n<p>전체 개방 기준 20분은 구역별 체류 시간의 합으로 관리한다. 1차 빌드는 잠금 구역 2곳을 제외해 16분 30초다. 플레이 테스트에서 특정 구역의 체류 시간이 목표의 1.5배를 넘으면 집기 수가 아니라 동선 길이를 먼저 의심한다. 첫 맵에서 시간이 늘어나는 원인은 대부분 파밍량이 아니라 길 찾기 실패다.</p>\n<h3>시간 예산</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>구간</th><th>목표 시간</th><th>누적</th><th>허용 편차</th></tr></thead><tbody>\n<tr><td>A 입구·계산대</td><td>1:30</td><td>1:30</td><td>±0:15</td></tr>\n<tr><td>순환 회랑 · G 광장</td><td>2:00</td><td>3:30</td><td>±0:30</td></tr>\n<tr><td>B 냉장·음료</td><td>3:00</td><td>6:30</td><td>±0:30</td></tr>\n<tr><td>C 식품 코너</td><td>3:30</td><td>10:00</td><td>±0:40</td></tr>\n<tr><td>H 사무실 <em>(1차 빌드 잠금)</em></td><td>2:00</td><td>12:00</td><td>±0:20</td></tr>\n<tr><td>D 냉동창고</td><td>3:00</td><td>15:00</td><td>±0:40</td></tr>\n<tr><td>E 물류창고 (보관실 포함)</td><td>3:00</td><td>18:00</td><td>±0:30</td></tr>\n<tr><td>F 생활용품</td><td>1:30</td><td>19:30</td><td>±0:30</td></tr>\n<tr><td>귀환</td><td>0:30</td><td>20:00</td><td>±0:10</td></tr>\n</tbody></table></div>\n<h3>귀환 지점</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>ID</th><th>위치</th><th>활성 조건</th><th>역할</th></tr></thead><tbody>\n<tr><td>R1</td><td>A 입구 안쪽 (52, 10)</td><td>항상 활성</td><td>최초 귀환 경로 보장</td></tr>\n<tr><td>R2</td><td>G 광장 (50, 44)</td><td>항상 활성</td><td>맵 중앙. 귀환 판단의 핵심</td></tr>\n<tr><td>R3</td><td>E 하역구 (84, 88)</td><td>셔터 개방 시</td><td>심부에서의 탈출 보장</td></tr>\n</tbody></table></div>\n<h3>배치 검수 체크리스트</h3>\n<p>공통 검수 항목 10가지는 공통 문서를 따른다. 아래는 이 맵에만 해당하는 항목이다.</p>\n<ol>\n<li>서후문과 북후문이 각각 카드키와 셔터 없이 열리지 않는가. 전실 외에 보스존으로 들어갈 수 있는 통행 가능한 틈이 없는가.</li>\n<li>A ↔ B 경계(X 28, Z 5~28)가 완전히 막혀 있는가.</li>\n<li>막힌 통로 X1, X2가 진입 전에 보이는가.</li>\n<li>D 중앙 반경 9에 밴드 B 이상 집기가 하나도 없는가.</li>\n<li>개활 예외가 A 스폰 포켓과 D 중앙 개활지 두 곳뿐인가.</li>\n<li>서브 루트 5개가 모두 통행 가능하며, 조건부 루트는 조건 없이 열리지 않는가.</li>\n<li>인공 광원이 하나도 배치되지 않았고, 실시간 라이트가 L1 하나뿐인가.</li>\n<li>일반 빌드에서 시연자용 보관함이 비활성화되는가.</li>\n<li>잠금 구역 2곳의 외벽과 문이 제작되어 있고, 잠긴 문 앞에 필요한 아이템 이름이 표시되는가.</li>\n</ol>\n<blockquote>체크리스트는 배치 작업이 끝날 때마다 공통 문서의 항목과 함께 다시 확인한다. 특히 카메라 뷰 검수와 경로 지형 갱신이 누락되기 쉽다.</blockquote>\n\n<h2>11. 구역별 집기 배치 상세</h2>\n<h3>구역 설명</h3>\n<p>벽과 기둥을 제외한 집기 단위의 배치를 정의한다. 진열대 열의 피치는 진열대 폭 1.2에 통로 6을 더한 7.2로 고정하며, 이 값이 구역 폭 23에 3열이 들어가는 근거다. 통로 6은 공통 문서의 밴드 B 기준에서 나온 값이다.</p>\n<h3>폐마트 전용 집기 규격</h3>\n<p>공통 오브젝트(팔레트·박스·잔해·파렛트 랙·기둥·벽) 규격은 공통 문서를 따른다. 여기서는 이 맵에만 쓰는 집기만 정의한다.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>집기</th><th>규격 (길이 × 폭 × 높이)</th><th>밴드</th></tr></thead><tbody>\n<tr><td>곤돌라 진열대</td><td>8~10 × 1.2 × 1.2</td><td>B</td></tr>\n<tr><td>엔드캡 판촉대</td><td>2 × 1.2 × 1.2</td><td>B</td></tr>\n<tr><td>계산대</td><td>3 × 1.2 × 1.0</td><td>B</td></tr>\n<tr><td>카트 보관대</td><td>6 × 1.6 × 1.0</td><td>B</td></tr>\n<tr><td>지게차</td><td>3 × 1.5 × 1.8</td><td>B</td></tr>\n<tr><td>냉장 쇼케이스</td><td>2.4 × 0.8 × 2.0</td><td>C</td></tr>\n<tr><td>사무 캐비닛 / 락커</td><td>1.6 × 0.6 × 1.8</td><td>C</td></tr>\n<tr><td>전복 카트</td><td>1.0 × 0.6 × 0.5</td><td>A</td></tr>\n</tbody></table></div>\n<h3>구역별 배치</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>구역</th><th>배치 상세</th><th>점유율</th></tr></thead><tbody>\n<tr><td>A 입구·계산대</td><td>계산대 8대를 Z 14~17 라인에 X 36~76, 피치 5로 배치한다. 계산대 사이 통로는 2다. 카트 보관대 2기를 (30~36, 8~9.6)과 (30~36, 11~12.6)에 둔다. 전복 카트 클러스터 5곳, 전단지 스탠드 3기를 회랑 진입 방향으로 눕힌다. S3 통로는 Z 10~14, X 60~92에 폭 4로 확보한다.</td><td>24%</td></tr>\n<tr><td>B 냉장·음료</td><td>쇼케이스를 서벽(X 5.2~6, Z 8~36)에 12기, 남벽(Z 5.2~6, X 8~26)에 7기 부착한다. 음료 매대는 Z축 장축 3열 2단이며 열 중심은 X 10.8 / 18 / 25.2, 단은 Z 12~20과 Z 26~34이다. 단 사이 가로 통로는 Z 20~26으로 폭 6이다. 파손 매대 1기가 S1 관통구가 된다.</td><td>28%</td></tr>\n<tr><td>C 식품 코너</td><td>곤돌라 3열 2단이며 열 중심은 X 10.8 / 18 / 25.2, 단은 Z 43~53과 Z 59~69이다. 길이는 10으로 B보다 길게 잡아 통과 시간을 늘린다. 엔드캡 12기를 각 열 끝에 둔다. 천장재 잔해 3곳을 (14,56) (21,48) (9,64)에 지름 3~4로 배치한다.</td><td>30%</td></tr>\n<tr><td>H 사무실</td><td>캐비닛 6기를 북벽과 서벽에 부착하고 락커 4기를 (8~12, 74~76)에 둔다. 책상 3기와 파티션 2기로 내부를 나눈다. 통로 폭은 4이며, 벽 투명화가 있으므로 좁아도 시야가 확보된다.</td><td>26%</td></tr>\n<tr><td>D 냉동창고</td><td>외곽 집기 링은 팔레트 적재대 8기를 서·동 벽에서 3 이격해 X 32와 X 68 라인에 Z 75 / 81 / 87 / 92로 배치한다. 남북 벽면은 중앙 개활지 반경 9와 3 이격만 남아 집기를 두지 않는다. 중앙 교전 개활지에는 밴드 A 팔레트 4개만 (43,79) (57,79) (43,89) (57,89)에 산재시킨다. 자세한 내용은 8장을 따른다.</td><td>22%</td></tr>\n<tr><td>E 물류창고</td><td>파렛트 랙 2열을 X 중심 77과 89, Z 60~90에 세운다. 랙 사이 통로는 X 78~88로 폭 10이며, 이는 공통 문서의 밴드 D 데드존 대응 기준이다. 박스 더미 8기와 지게차 1대를 통로에 반쯤 걸치게 둔다.</td><td>30%</td></tr>\n<tr><td>F 생활용품</td><td>곤돌라 3열 2단이며 열 중심은 X 76.8 / 84 / 91.2, 단은 Z 32~42와 Z 46~52이다. 이 구역만 파손 집기를 두지 않아 격자가 완전하게 남아 있고, 그래서 엄폐 학습에 가장 적합하다.</td><td>27%</td></tr>\n<tr><td>G 중앙 광장</td><td>잔해 더미 4기는 (44,49) (56,49) (50,43) (50,55)에 두되 사이 간격을 2~3으로 유지한다. 특설 매대 4기를 광반 바깥 (40,40) (60,40) (40,58) (60,58)에 둔다. 판촉 배너 잔해 3기와 잡초 패치 6곳은 밴드 A다.</td><td>25%</td></tr>\n<tr><td>순환 회랑</td><td>8~12 간격으로 전복 카트, 엔드캡, 잔해를 배치해 시선 앵커를 만든다. 앵커는 통로 폭을 잠식하지 않도록 회랑 가장자리에 붙인다.</td><td>12%</td></tr>\n</tbody></table></div>\n<h3>구성 요소 기반 로직</h3>\n<ol>\n<li>진열대 장축은 구역마다 하나로 통일하고 인접 구역과는 교차시킨다. 축이 바뀌는 것 자체가 구역 전환의 신호가 된다.</li>\n<li>파손 집기는 B와 C에만 둔다. F는 격자가 온전해야 학습 구역으로 기능한다.</li>\n<li>쇼케이스와 캐비닛 같은 밴드 C 집기는 전부 벽면에 부착한다. 통로에 세우면 캐릭터를 통째로 가린다.</li>\n<li>파렛트 랙은 투명화 레이어에 포함시킨다. 높이 5의 데드존 10.1은 투명화 없이는 감당할 수 없다.</li>\n<li>개활 예외 두 곳은 A 스폰 포켓 (44~60, 5~12)과 D 중앙 개활지다. 그 외에는 공통 문서의 개활 상한을 그대로 적용한다.</li>\n<li>기습 앵커 금지 구역은 A 스폰 포켓, 귀환 지점 R1·R2·R3 반경 8, 북서 코너 협착부(폭 5), X1·X2 앞이다.</li>\n</ol>\n\n<h2>12. 기믹 시트</h2>\n<h3>구역 설명</h3>\n<p>기믹은 12종이며 배치 지점은 24곳이다. 참고 문서의 다섯 가지(셔터, 잠긴 문, 오염 존, 유리 파편, 붕괴 지름길)를 이 맵의 구조에 맞게 옮기고, 광원이 없는 폐마트와 익스트랙션 파밍이라는 조건에 맞는 일곱 가지를 추가했다. 추가 기믹의 공통 방향은 두 가지다. 하나는 소리로 정보를 만드는 것이고, 다른 하나는 플레이어가 공간을 직접 바꿔 기습에 대응하게 하는 것이다.</p>\n<h3>기믹 배치도</h3>\n<div class=\"warn\">기믹 배치도 SVG는 아직 옮기지 않았다. 노션 원본의 <strong>MAP01_기믹_배치도</strong> 도면을 이 자리에 넣는다.</div>\n<h3>기믹 시트</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>ID</th><th>기믹</th><th>배치 위치</th><th>조작</th><th>효과</th><th>난이도</th><th>1차 빌드</th></tr></thead><tbody>\n<tr><td>G1</td><td>셔터 개방</td><td>E 하역구 (95,80) · D 북후문 (72,92)</td><td>홀드 3초</td><td>개방 후 닫을 수 없다. 하역구 개방 시 R3 귀환 지점이 활성화된다</td><td>하</td><td>포함</td></tr>\n<tr><td>G2</td><td>잠긴 문 · 타 맵 열쇠</td><td>H 앞문 (11,72) · E 보관실 (84,90)</td><td>아이템 소지</td><td>잠금 구역을 개방한다. 열쇠는 스테이지 2에서 획득한다</td><td>하</td><td>제외</td></tr>\n<tr><td>G3</td><td>오염 존</td><td>D 냉동창고 (50,84)</td><td>진입</td><td>지속 피해로 체류 시간을 강제 제한한다. 보스존의 압박 장치다</td><td>하</td><td>포함</td></tr>\n<tr><td>G4</td><td>유리 파편 소음</td><td>A (46,22) · B (10,30) · G (44,52)</td><td>밟기</td><td>파열음이 재생된다. 광원이 없는 맵에서 위치를 알리는 주 수단이다</td><td>하</td><td>포함</td></tr>\n<tr><td>G5</td><td>붕괴 지름길</td><td>B ↔ C (15,40) · F (84,44)</td><td>없음</td><td>넘어진 진열대 사이로 통로가 단축된다. 별도 로직이 없다</td><td>하</td><td>포함</td></tr>\n<tr><td>G6</td><td>유리 자동문</td><td>A 북벽 (48,28) · (64,28)</td><td>홀드 2초</td><td>전기가 끊겨 손으로 밀어 연다. 한 번 열면 열린 채 유지된다</td><td>하</td><td>포함</td></tr>\n<tr><td>G7</td><td>카트 밀기</td><td>A (34,20) · 회랑 (46,31) · C (14,58)</td><td>밀기</td><td>이동식 반엄폐물이 된다. 굴려 보내면 소음으로 주의를 돌릴 수 있다</td><td>중</td><td>포함</td></tr>\n<tr><td>G8</td><td>진열대 도미노</td><td>C (18,48) · F (88,36)</td><td>홀드 2초</td><td>넘어뜨려 통로를 막거나 새 통로를 만든다. 되돌릴 수 없다</td><td>중</td><td>포함</td></tr>\n<tr><td>G9</td><td>잠긴 유리 진열장</td><td>A 계산대 (68,16) · H (18,88)</td><td>타격</td><td>깨야 열린다. 파괴음이 크게 울린다</td><td>하</td><td>포함</td></tr>\n<tr><td>G10</td><td>스프링클러 파열</td><td>C (12,64) · G (58,44)</td><td>타격</td><td>물이 뿜어져 시야를 가리고 소음을 낸다. 젖은 바닥이 반사면으로 남는다</td><td>중</td><td>후순위</td></tr>\n<tr><td>G11</td><td>냉기 방출</td><td>D 전실 (50,71)</td><td>문 개폐</td><td>성에 안개로 일시적으로 시야가 줄어든다. 보스존 진입 연출을 겸한다</td><td>중</td><td>후순위</td></tr>\n<tr><td>G12</td><td>자판기 전도</td><td>회랑 (31,46) · (69,52) · (58,68)</td><td>홀드 2초</td><td>넘어뜨려 통로를 봉쇄한다. 추격을 끊는 용도다</td><td>중</td><td>포함</td></tr>\n</tbody></table></div>\n<h3>기믹 설계 원칙</h3>\n<ol>\n<li>모든 기믹은 1회성 플래그 또는 상태 토글로 구현하고 컷신과 카메라 연출은 사용하지 않는다.</li>\n<li>되돌릴 수 없는 기믹은 G1 셔터, G8 도미노, G12 전도 세 가지다. 되돌릴 수 없다는 사실이 결정에 무게를 준다.</li>\n<li>광원이 없으므로 소음 기믹(G4 · G7 · G9 · G10)이 정보 전달의 주 수단이다. 시각 예고가 약한 구역일수록 소음 기믹을 늘린다.</li>\n<li>G7 카트 밀기와 G12 자판기 전도는 공통 문서의 기습 등장 앵커 조건에 대한 플레이어의 대응 수단이다. 기습을 넣는다면 대응 수단도 함께 있어야 한다.</li>\n<li>상호작용 홀드 시간은 공통 문서 기준대로 2초와 3초 두 가지만 쓴다.</li>\n</ol>\n<blockquote>난이도 \"중\"으로 표기한 네 가지(G7 · G8 · G10 · G12)는 오브젝트가 물리적으로 움직여야 하므로 경로 지형 갱신이 함께 필요하다. 구현 순서를 잡을 때 이 점을 고려한다.</blockquote>\n\n<h2>13. 1차 빌드 범위와 잠금 구역</h2>\n<h3>구역 설명</h3>\n<p>전체 볼륨은 20분이지만 개발 기간을 고려해 1차 빌드에서는 두 구역을 잠근다. 잠금은 콘텐츠를 삭제하는 것이 아니라 개방 조건을 다른 맵으로 미루는 방식이다. 플레이어에게는 \"이 맵에는 아직 못 여는 곳이 있다\"는 재방문 동기가 되고, 제작 측에서는 해당 구역의 내부 배치와 기믹을 후순위로 미룰 수 있다.</p>\n<h3>잠금 구역</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>구역</th><th>범위</th><th>개방 아이템</th><th>획득처</th><th>절감 볼륨</th></tr></thead><tbody>\n<tr><td>H 사무실</td><td>(5~28, 72~95) 23 × 23</td><td>관리자 카드키</td><td>스테이지 2 폐상가</td><td>2:00</td></tr>\n<tr><td>E 보관실</td><td>(84~95, 84~95) 11 × 11</td><td>비상 개방키</td><td>스테이지 2 폐상가</td><td>1:30</td></tr>\n</tbody></table></div>\n<h3>잠금이 미치는 영향</h3>\n<div class=\"table-scroll\"><table><thead><tr><th>항목</th><th>전체 개방</th><th>1차 빌드</th></tr></thead><tbody>\n<tr><td>플레이 타임</td><td>20:00</td><td>16:30</td></tr>\n<tr><td>보스존 진입 경로</td><td>전실 · 서후문 · 북후문 3곳</td><td>전실 · 북후문 2곳</td></tr>\n<tr><td>서브 루트</td><td>S1 · S2 · S3 · S4 · S5</td><td>S1 · S3 · S4 · S5</td></tr>\n<tr><td>기믹</td><td>12종</td><td>9종 (G2 제외, G10 · G11 후순위)</td></tr>\n<tr><td>구역 수</td><td>8</td><td>7 (E 보관실은 E의 일부)</td></tr>\n</tbody></table></div>\n<h3>구성 요소 기반 로직</h3>\n<ol>\n<li>잠긴 문 앞에서는 필요한 아이템의 이름을 표시한다. 무엇이 필요한지 모르면 재방문 동기가 아니라 답답함이 된다.</li>\n<li>잠금 구역은 메인 루프에서 벗어나 있어야 한다. H는 북서 코너, E 보관실은 물류창고 안쪽이라 잠겨도 순환이 끊기지 않는다.</li>\n<li>1차 빌드에서도 두 구역의 외벽과 문은 제작한다. 내부 배치와 기믹만 후순위로 미룬다.</li>\n<li>서후문이 잠기면 보스존 서측 진입이 막히므로, 북후문 셔터가 1차 빌드의 유일한 대체 진입로가 된다. 셔터 개방을 반드시 발견할 수 있게 물류 문 정면에 배치한다.</li>\n</ol>\n<div class=\"warn\">잠금 구역을 늘려 볼륨을 더 줄이고 싶다면 C 식품 코너가 아니라 E 물류창고 본체를 후보로 삼는다. C는 대표 판매품이 있는 필수 경유지라 잠그면 파밍 동기 자체가 약해진다.</div>\n\n<h2>참고 · 연결 문서</h2>\n<p>본문 중간에서 다른 문서를 언급할 때는 대괄호 두 개로 링크를 걸고, 아래 목록에 번호와 함께 다시 정리한다.</p>\n<ol>\n<li>[[공통 - 레벨 메트릭스 / 스펙]] — 좌표계, 카메라와 투영, 벽 투명화, 집기 밴드, 통로 폭, 개활 면적, 기습 앵커</li>\n<li>장애물 시스템 기획서 — 집기의 시야·이동 차단 판정, 경로 지형 갱신</li>\n<li>아이템 컨셉 기획서 — 아이템 등급과 구역별 가치 배분</li>\n<li>몬스터 시스템 기획서 — 배치 확정 시 공통 문서의 앵커 조건과 연동 (미작성)</li>\n<li>배경 디자인 작업자용 문서 — 가독성 기준, 색 기준</li>\n<li>스테이지 2 폐상가 — 관리자 카드키와 비상 개방키 획득처 (미작성)</li>\n</ol>\n<blockquote><strong>작업 메모</strong> — 이 페이지가 MAP 01의 기준 문서다. 수치를 고칠 때는 표만 수정하고 본문은 그대로 둔다. 공통 기준을 바꿔야 하면 이 문서가 아니라 공통 문서를 고친다.</blockquote>"}]}</script>
<script>
(function () {

  var project = "";
  var types = DEFAULT_TYPES.slice();

  var view = "home";

  var stage = $("stage");

  /* ===== 본문 정리 ===== */
  var ALLOWED = {
    P: ["class"], DIV: ["class"], H2: ["class"], H3: ["class"], H4: ["class"],
    UL: ["class"], OL: ["class"], LI: ["class"],
    STRONG: ["class"], B: [], EM: [], I: [], U: [], BR: [], MARK: [], PRE: [],
    BLOCKQUOTE: ["class"], TABLE: ["class"], THEAD: [], TBODY: [], TR: [],
    TH: ["width", "class"], TD: ["width", "class"], COLGROUP: [], COL: ["width"],
    IMG: ["src", "alt", "width"], A: ["href"], SPAN: [], HR: []
  };
  var IMG_OK = /^(data:image\/(png|jpeg|jpg|gif|webp);base64,|https?:\/\/)/i;
  function sanitize(html) {
    var box = document.createElement("div");
    box.innerHTML = html || "";
    (function walk(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function (n) {
        if (n.nodeType === 3) return;
        if (n.nodeType !== 1) { n.remove(); return; }
        var tag = n.tagName;
        if (tag === "CODE") { var mk = document.createElement("mark"); while (n.firstChild) mk.appendChild(n.firstChild); n.replaceWith(mk); walk(mk); return; }
        if (!Object.prototype.hasOwnProperty.call(ALLOWED, tag)) {
          var p = document.createElement("p");
          while (n.firstChild) p.appendChild(n.firstChild);
          n.replaceWith(p); walk(p); return;
        }
        Array.prototype.slice.call(n.attributes).forEach(function (a) {
          if (ALLOWED[tag].indexOf(a.name) === -1) n.removeAttribute(a.name);
        });
        if (tag === "A") {
          var href = n.getAttribute("href") || "";
          if (!/^(https?:|mailto:|#)/i.test(href)) n.removeAttribute("href");
          else { n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); }
        }
        if (tag === "IMG" && !IMG_OK.test(n.getAttribute("src") || "")) { n.remove(); return; }
        walk(n);
      });
    })(box);
    return box.innerHTML;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }

  /* ===== 문서 연결 ===== */
  function titleSet() {
    var m = {};
    docs.forEach(function (d) { m[(d.title || "").trim()] = d.id; });
    return m;
  }
  function linkify(html) {
    var known = titleSet();
    var box = document.createElement("div");
    box.innerHTML = html || "";
    var walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, null);
    var targets = [];
    while (walker.nextNode()) if (/\[\[.+?\]\]/.test(walker.currentNode.nodeValue)) targets.push(walker.currentNode);
    targets.forEach(function (node) {
      var frag = document.createDocumentFragment();
      var rest = node.nodeValue, re = /\[\[(.+?)\]\]/g, last = 0, m;
      while ((m = re.exec(rest))) {
        if (m.index > last) frag.appendChild(document.createTextNode(rest.slice(last, m.index)));
        var name = m[1].trim();
        var a = document.createElement("span");
        a.className = "wikilink"; a.setAttribute("data-target", name); a.textContent = name;

    var moveTo = types.filter(function (x) { return x !== t; })[0];
    var msg = n ? "“" + t + "” 분류를 삭제한다. 이 분류의 문서 " + n + "개는 “" + moveTo + "”로 옮긴다."
                : "“" + t + "” 분류를 삭제한다.";

  /* ===== 목차 서랍 ===== */
  var dragId = null;

    $("railSub").textContent = d ? [project, d.docType].filter(Boolean).join(" / ") : "";
    if (!d) return;

    var body = $("docBody");
    var heads = body ? Array.prototype.slice.call(body.querySelectorAll("h2")) : [];
    if (!heads.length) {
      var none = document.createElement("p");
      none.className = "toc-empty";
      none.textContent = "제목이 없어 목차를 만들 수 없다. 본문에 제목을 넣으면 여기에 모인다.";

  function jumpTo(el) {

  }
  function markToc() {
    var body = $("docBody");
    if (!body) return;
    var heads = Array.prototype.slice.call(body.querySelectorAll("h2"));
    if (!heads.length) return;
    var line = document.querySelector(".topbar").offsetHeight + 24;
    var active = heads[0].id;
    heads.forEach(function (h) { if (h.getBoundingClientRect().top <= line) active = h.id; });
    Array.prototype.slice.call(railList.querySelectorAll(".toc-item")).forEach(function (b) {

    var out = [], placed = false;

      if (e.clientX < r.right - EDGE) return;
      e.preventDefault();
      history.flush();
      var table = cell.closest("table");
      var at = cellIndex(cell);
      var rows = allRows(table);
      var startX = e.clientX;
      var widths = Array.prototype.slice.call(rows[0].children).map(function (c) { return c.getBoundingClientRect().width; });
      table.classList.add("fixed");
      rows.forEach(function (tr) {
        Array.prototype.slice.call(tr.children).forEach(function (c, i) {
          if (widths[i]) c.setAttribute("width", Math.round(widths[i]));
        });
      });
      function move(ev) {
        var w = Math.max(52, Math.round(widths[at] + ev.clientX - startX));
        rows.forEach(function (tr) { if (tr.children[at]) tr.children[at].setAttribute("width", w); });
      }
      function up() {
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up);
        syncBody(); history.flush();
      }
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
  }

  /* ===== 문서 만들기 ===== */
  function newId() { return "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function createDoc(seed) {
    var type = (seed && seed.docType) || typeFilter || types[0];
    if (types.indexOf(type) === -1) type = types[0];
    var g = sorted(docs.filter(function (d) { return d.docType === type; }));
    docs.push({
      id: newId(), title: (seed && seed.title) || "제목 없는 문서",
      docType: type, order: g.length ? (g[g.length - 1].order || 0) + 1 : 0,
      html: "", updatedAt: nowStamp()
    });
    markDirty();
    return docs[docs.length - 1].id;
  }
  function openDoc(id, startEditing) {
    currentId = id; editing = !!startEditing;
    renderDoc(); window.scrollTo(0, 0);
    document.body.removeAttribute("data-rail");
  }
  function goHome() { renderHome(); window.scrollTo(0, 0); }
  function refresh() { if (view === "home") renderHome(); else renderDoc(); }

  /* ===== 공유 파일 ===== */
  function buildSelfHTML() {
    var root = document.documentElement.cloneNode(true);
    var rl = root.querySelector("#railList"); if (rl) rl.innerHTML = "";
    var st = root.querySelector("#stage"); if (st) st.innerHTML = "";
    var rp = root.querySelector("#railProject"); if (rp) rp.textContent = "";
    var sv = root.querySelector("#status"); if (sv) { sv.textContent = ""; sv.setAttribute("data-state", "idle"); }
    Array.prototype.slice.call(root.querySelectorAll(".toast, .menu, .overlay")).forEach(function (n) { n.remove(); });
    var b = root.querySelector("body"); if (b) b.removeAttribute("data-rail");
    var seed = root.querySelector("#seed");
    seed.textContent = JSON.stringify({ v: 3, savedAt: nowStamp(), project: project, types: types, docs: docs })
      .replace(/<\/(script)/gi, "<\\/$1");
    return "<!doctype html>\n" + root.outerHTML;
  }
  function shareFile() {
    if (editing) { syncBody(); }
    history.flush();
    var html = buildSelfHTML();
    if (window.showSaveFilePicker) {
      (async function () {
        try {
          if (!fileHandle) {
            fileHandle = await window.showSaveFilePicker({
              suggestedName: "index.html",
              types: [{ description: "HTML", accept: { "text/html": [".html"] } }]
            });
          }
          var w = await fileHandle.createWritable();
          await w.write(html); await w.close();
          savedAt = nowStamp(); dirty = false; setStatus();
          toast("파일에 반영했다. 크기 " + sizeText(html));
        } catch (e) {
          if (e && e.name === "AbortError") return;
          fileHandle = null;
          downloadFile(html);
        }
      })();
      return;
    }
    downloadFile(html);
  }
  function sizeText(html) {
    var mb = new Blob([html]).size / (1024 * 1024);
    return mb < 1 ? Math.round(mb * 1024) + "KB" : mb.toFixed(1) + "MB";
  }
  function downloadFile(html) {
    var blob = new Blob([html], { type: "text/html;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "index.html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    savedAt = nowStamp(); dirty = false; setStatus();
    toast("파일을 내려받았다. 저장소 폴더에 덮어쓴다. 크기 " + sizeText(html));
  }

  /* ===== 테마 ===== */
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    $("themeBtn").textContent = t === "dark" ? "라이트" : "다크";
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }

  /* ===== 이벤트 ===== */
  $("homeBtn").addEventListener("click", goHome);
  $("newBtn").addEventListener("click", function () { openDoc(createDoc({}), true); });
  $("shareBtn").addEventListener("click", shareFile);
  $("themeBtn").addEventListener("click", function () {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
  $("modeBtn").addEventListener("click", function () {
    if (editing) { syncBody(); history.flush(); editing = false; }
    else editing = true;
    renderDoc();
  });
  $("railToggle").addEventListener("click", function (e) {
    e.stopPropagation();
    if (document.body.getAttribute("data-rail") === "open") document.body.removeAttribute("data-rail");
    else { document.body.setAttribute("data-rail", "open"); markToc(); }
  });
  $("main").addEventListener("mousedown", function (e) {
    if (document.body.getAttribute("data-rail") !== "open") return;
    if (e.target.closest("#railToggle")) return;
    document.body.removeAttribute("data-rail");
  }, true);
  document.addEventListener("keydown", function (e) {
    var meta = e.metaKey || e.ctrlKey;
    if (e.key === "Escape" && openMenu) { closeMenu(); return; }
    if (meta && e.key.toLowerCase() === "s") { e.preventDefault(); shareFile(); return; }
    if (meta && e.key.toLowerCase() === "z" && editing && document.activeElement === $("docBody")) {
      e.preventDefault(); if (e.shiftKey) history.redo(); else history.undo(); return;
    }
    if (meta && e.key.toLowerCase() === "y" && editing && document.activeElement === $("docBody")) {
      e.preventDefault(); history.redo(); return;
    }
    if (e.key === "Escape" && editing) { syncBody(); editing = false; renderDoc(); }
  });
  window.addEventListener("beforeunload", function (e) {
    cache();
    if (dirty) { e.preventDefault(); e.returnValue = ""; }
  });

  /* ===== 시작 문서 ===== */
  function starterDocs() {
    var t = nowStamp();
    return [
      {
        id: "guide", title: "사용법과 문서 규칙", docType: "기타", order: 0, updatedAt: t,
        html:
          "<p>레벨 디자인 문서와 작업 로그를 모아 두는 곳이다. 편집을 마치고 저장을 누르면 문서가 확정되고, 공유를 누르면 이 파일 자체가 갱신된다. 갱신된 파일을 깃허브에 커밋하면 팀원이 보는 내용도 함께 바뀐다.</p>" +
          "<h2>제목 규칙</h2>" +
          "<p>문서 제목은 <strong class=\"em\">구역명 - 문서 유형</strong> 형식으로 쓴다. 목록에서 어느 맵의 어떤 문서인지 제목만 보고 판단할 수 있어야 한다. 프로젝트 이름은 메인 화면 위쪽에서 한 번만 설정한다.</p>" +
          "<h2>분류</h2>" +
          '<div class="table-scroll"><table class="fixed"><thead><tr><th>분류</th><th>담는 내용</th></tr></thead><tbody>' +
          "<tr><td>레벨 기획서</td><td>맵 하나의 공간 구조. 구역 배치, 동선, 집기, 기믹</td></tr>" +
          "<tr><td>메트릭스 / 스펙</td><td>맵마다 반복되는 공통 기준값</td></tr>" +
          "<tr><td>작업 로그</td><td>날짜별 작업 기록</td></tr>" +
          "<tr><td>회고</td><td>빌드나 테스트 이후의 판단 기록</td></tr>" +
          "</tbody></table></div>" +
          "<h3>분류와 순서 바꾸기</h3>" +
          "<p>메인 화면의 분류 칩에서 <mark>+ 분류</mark>로 추가하고, 칩을 우클릭해 이름 변경과 삭제를 한다. 문서 카드를 우클릭하면 이름 변경, 분류 바꾸기, 위아래 이동, 복제, 삭제를 쓸 수 있다. 카드를 끌어다 놓으면 순서가 바뀌고, 다른 분류의 카드 위에 놓으면 분류까지 함께 바뀐다.</p>" +
          "<h3>목차</h3>" +
          "<p>문서를 열고 왼쪽 위 목차 버튼을 누르면 그 문서의 제목이 순서대로 모인다. 항목을 누르면 해당 위치로 이동하고, 지금 읽고 있는 위치가 강조색으로 표시된다.</p>" +
          "<h3>표 고치기</h3>" +
          "<p>편집 중에 표 안을 우클릭하면 행과 열을 넣고 지울 수 있다. 셀 오른쪽 경계를 끌면 열 너비가 바뀐다.</p>" +
          "<h3>이미지</h3>" +
          "<p>툴바의 이미지 버튼으로 넣거나, 그림 파일을 본문에 끌어다 놓거나, 복사한 이미지를 붙여 넣는다. 이미지 오른쪽 아래 모서리를 끌면 크기가 바뀌고, 우클릭하면 너비와 정렬을 고르거나 전체화면으로 볼 수 있다. 읽기 상태에서는 이미지를 누르면 전체화면으로 열린다.</p>" +
          '<p class="aside">이미지는 파일 안에 함께 저장되므로 넣을수록 파일이 커진다. 긴 변 1600픽셀로 자동으로 줄여 넣는다.</p>' +
          "<h2>공통 기준은 나누지 않는다</h2>" +
          "<p>카메라와 투영, 좌표계, 벽 투명화, 집기 높이 밴드, 통로 폭, 개활 면적, 기습 앵커처럼 맵마다 반복되는 값은 개별 맵 문서에 적지 않는다. [[공통 - 레벨 메트릭스 / 스펙]] 한 곳에 두고 맵 문서는 그 값을 전제로 쓴다. 같은 값을 두 곳에 적으면 반드시 한쪽이 낡는다.</p>" +
          "<h2>문서 연결</h2>" +
          "<p>본문에 대괄호 두 개로 문서 제목을 감싸면 그 문서로 가는 링크가 된다. 문서 아래에 참조하는 문서와 참조받는 문서가 자동으로 모인다.</p>" +
          '<p class="aside">아직 없는 문서를 참조하면 링크가 흐리게 표시되고, 누르면 그 제목으로 새 문서가 만들어진다.</p>' +
          "<blockquote>되돌리기는 Ctrl+Z, 다시 실행은 Ctrl+Shift+Z, 파일 반영은 Ctrl+S다.</blockquote>"
      },
      {
        id: "common", title: "공통 - 레벨 메트릭스 / 스펙", docType: "메트릭스 / 스펙", order: 0, updatedAt: t,
        html:
          "<p>모든 맵이 전제하는 공통 기준값을 모은 문서다. 개별 맵 문서는 이 값을 다시 적지 않고 참조만 한다.</p>" +
          '<p class="aside">값을 바꿀 때는 이 문서만 고치고, 영향을 받는 맵 문서의 검수 항목을 다시 확인한다.</p>' +
          "<h2>카메라와 투영</h2>" +
          '<div class="table-scroll"><table class="fixed"><thead><tr><th>항목</th><th>값</th><th>근거</th></tr></thead><tbody>' +
          "<tr><td>Projection</td><td><br></td><td><br></td></tr>" +
          "<tr><td>Rotation</td><td><br></td><td><br></td></tr>" +
          "<tr><td>Ortho Size</td><td><br></td><td><br></td></tr>" +
          "<tr><td>가림 깊이</td><td><br></td><td><br></td></tr>" +
          "</tbody></table></div>" +
          "<h2>좌표계</h2><p>원점 위치, 축 방향, 표기 순서를 적는다.</p>" +
          "<h2>벽 투명화</h2><p>페이드 반경, 소프트 엣지, 알파 하한, 적용 레이어를 적는다.</p>" +
          "<h2>집기 높이 밴드</h2><p>밴드별 높이 범위와 대표 집기, 배치 제한을 적는다.</p>" +
          "<h2>통로 폭</h2><p>통로 종류별 최소 폭과 그 근거를 적는다.</p>" +
          "<h2>개활 면적</h2><p>연속 개활 상한과 분할 수단, 구역별 집기 점유율 범위를 적는다.</p>" +
          "<h2>기습 등장 앵커</h2><p>앵커 유형, 주 동선과의 거리, 앵커 간 간격, 후퇴 공간, 금지 구역을 적는다.</p>" +
          '<div class="warn">이 문서의 값을 고치면 기존 맵 문서의 검수 결과가 무효가 된다. 변경 시 영향을 받는 맵을 함께 적어 둔다.</div>'
      },
      {
        id: "map01", title: "MAP 01 폐마트 - 레벨 기획서", docType: "레벨 기획서", order: 0, updatedAt: t,
        html:
          "<p>튜토리얼 직후 진입하는 첫 번째 파밍 맵의 공간 구조를 정의한다. 공통 기준값은 [[공통 - 레벨 메트릭스 / 스펙]]을 따르며 이 문서에 다시 적지 않는다.</p>" +
          "<h2>문서 구성</h2>" +
          "<p>기존 기획서의 17장 구성을 그대로 옮긴다. 아래 순서대로 장을 채운다.</p>" +
          "<ol><li>문서 범위와 설계 기준</li><li>맵 볼륨과 좌표계</li><li>카메라와 투영 기준</li>" +
          "<li>구역별 배치 레이아웃</li><li>순환 동선과 불규칙화</li><li>서브 루트</li>" +
          "<li>중앙 특설 매대 광장</li><li>자연광 설계와 명도</li><li>벽 투명화와 집기 높이 밴드</li>" +
          "<li>냉동창고 보스존 공간 구조</li><li>시연 5분 동선 스크립트</li><li>시간 예산과 검수 기준</li>" +
          "<li>개활 면적과 집기 밀도</li><li>구역별 집기 배치 상세</li><li>기습 등장 앵커의 공간 조건</li>" +
          "<li>기믹 시트</li><li>1차 빌드 범위와 잠금 구역</li></ol>" +
          '<div class="warn">원본 기획서의 평면도와 기믹 배치도는 SVG 도면이라 이 편집기에서 다시 그릴 수 없다. 도면은 별도 이미지로 관리하고 여기서는 참조만 한다.</div>' +
          "<h2>1. 문서 범위와 설계 기준</h2><p>여기부터 원본 내용을 옮긴다.</p>"
      }
    ];
  }

  /* ===== 시작 ===== */
  (function boot() {
    var seed = null, cached = null;
    try { var raw = ($("seed").textContent || "").trim(); if (raw) seed = JSON.parse(raw); } catch (e) {}
    try { var c = localStorage.getItem(STORE_KEY); if (c) cached = JSON.parse(c); } catch (e) {}

    var src = null;
    if (seed && Array.isArray(seed.docs)) { src = seed; savedAt = seed.savedAt || ""; }
    else if (cached && Array.isArray(cached.docs) && cached.docs.length) src = cached;

    if (seed && cached && cached.at && seed.savedAt) {
      var seedTime = new Date(seed.savedAt.replace(" ", "T")).getTime();
      if (cached.at > seedTime + 60000 && cached.docs && cached.docs.length) { src = cached; dirty = true; }
    }

    if (src) {
      docs = src.docs;
      project = src.project || "";
      types = (Array.isArray(src.types) && src.types.length) ? src.types.slice() : DEFAULT_TYPES.slice();
    } else {
      docs = starterDocs();
      project = "Repair";
    }
    docs.forEach(function (d, i) {
      if (typeof d.order !== "number") d.order = i;
      delete d.project; delete d.zone;
      if (types.indexOf(d.docType) === -1) types.push(d.docType || "기타");
    });

    var th = "dark";
    try { th = localStorage.getItem(THEME_KEY) || "dark"; } catch (e) {}
    applyTheme(th === "light" ? "light" : "dark");

    setStatus();
    renderHome();
    syncTopbar();
  })();
})();
</script>
